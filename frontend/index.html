<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAMS – Student Admission Management</title>
    <meta name="description" content="Student Admission Management System for international education agencies" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* Page-load flash prevention */
      html, body { margin: 0; padding: 0; background: #f4f6fa; }
      #root-loader {
        position: fixed; inset: 0; display: flex; align-items: center;
        justify-content: center; background: #f4f6fa; z-index: 9999;
        transition: opacity 0.3s;
      }
      #root-loader .dot {
        width: 8px; height: 8px; border-radius: 50%; background: #1F3A5F;
        margin: 0 4px; animation: bounce 1.2s infinite ease-in-out;
      }
      #root-loader .dot:nth-child(2) { animation-delay: 0.2s; }
      #root-loader .dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes bounce { 0%,80%,100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root-loader">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div id="root"></div>
    <script>
      // Remove loader once React mounts
      document.addEventListener('DOMContentLoaded', () => {
        const obs = new MutationObserver(() => {
          const root = document.getElementById('root');
          if (root && root.children.length > 0) {
            const loader = document.getElementById('root-loader');
            if (loader) { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 300); }
            obs.disconnect();
          }
        });
        obs.observe(document.getElementById('root'), { childList: true });
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
